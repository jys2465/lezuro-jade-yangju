<body><div><h2>앱 주소가 바뀌었어요</h2><p>잠시 뒤 새 주소로 옮겨 드려요.<br>홈 화면의 옛 아이콘은 지우고 새 주소에서 다시 추가해 주세요.</p><a id="go" href="https://jys2465.github.io/parkgolf-note/">새 주소로 가기</a></div>
<script>
(async function () {
  try { if ('serviceWorker' in navigator) { var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function (r) { return r.unregister(); })); } } catch (e) {}
  try { if (window.caches) { var ks = await caches.keys(); await Promise.all(ks.map(function (k) { return caches.delete(k); })); } } catch (e) {}
  var t = ''; try { t = localStorage.getItem('lz.t') || ''; } catch (e) {}
  location.replace('https://jys2465.github.io/parkgolf-note/' + location.search + location.hash);
})();
</script></body></html>
